name: pawter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  image_picker: ^1.2.1
  go_router: ^17.1.0
  email_validator: ^3.0.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  firebase_database: ^12.1.4
  table_calendar: ^3.2.0
  intl: ^0.20.2
  firebase_storage: ^13.2.0
  pdf: ^3.10.8
  printing: ^5.11.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/LogoPawter.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/LogoPawter.png"

flutter:
  uses-material-design: true

  assets:
    - assets/LogoPawter.png